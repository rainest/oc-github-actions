name: Build image
run-name: GoReleaser ${{ (inputs.snapshot == 'true' || (inputs.snapshot != 'false' && !startsWith(github.ref, 'refs/tags/v'))) && 'Snapshot' || 'Release' }}

on:
  workflow_call:
    inputs:
      # obtained from go.mod instead. see below
      #go-version:
      #  description: 'Go version to use'
      #  required: false
      #  type: string
      #  default: 'stable'
      fetch-depth:
        description: 'Git fetch depth for checkout'
        required: false
        type: number
        default: 0
      fetch-tags:
        description: 'Whether to fetch tags during checkout'
        required: false
        type: number
        default: 1
      cgo-enabled:
        description: 'Set CGO_ENABLED environment variable'
        required: false
        type: string
        default: ''
      additional-env-vars:
        description: 'Additional environment variables to set (KEY=value format, one per line)'
        required: false
        type: string
        default: ''
      registry-name:
        description: 'Container registry name (e.g., ghcr.io/openchami/project-name) to Generate build provenance for container'
        required: true
        type: string
      docker-target:
        description: 'Dockerfile target to build'
        required: false
        type: string
        default: 'main'

permissions: write-all # Necessary for the generate-build-provenance action with containers

jobs:
  build-push-images:
    environment: 'Docker Push'
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup golang
        uses: actions/setup-go@v5.5.0
        with:
          # the original GoReleaser job used this. I think go.mod automagic is probably always
          # a better choice unless it doesn't work with workflow call. Per
          # https://github.com/actions/setup-go?tab=readme-ov-file#getting-go-version-from-the-gomod-file we can
          # maybe make it optional as an override? unsure if it handles empty go-version well.
          #go-version: ${{ inputs.go-version }}
          go-version-file: go.mod

      - run: echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV

      - run: echo "GOCACHE=$(go env GOCACHE)" >> $GITHUB_ENV

      - name: Set CGO_ENABLED if specified
        if: ${{ inputs.cgo-enabled != '' }}
        run: echo "CGO_ENABLED=${{ inputs.cgo-enabled }}" >> $GITHUB_ENV

      - name: Set additional environment variables
        if: ${{ inputs.additional-env-vars != '' }}
        run: |
          # Process additional environment variables
          echo "${{ inputs.additional-env-vars }}" | while IFS= read -r line; do
            if [[ -n "$line" && "$line" == *"="* ]]; then
              echo "$line" >> $GITHUB_ENV
            fi
          done

      # TODO this just removes inputs.pre-build-commands, with the expectation that
      # you can do whatever in Docker instead, and have no reason to run stuff in the runner itself

      - name: Set up Docker Buildkit
        uses: docker/setup-buildx-action@v3.11.1

      - name: Cache Docker layers
        uses: actions/cache@v4.2.3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Fill image meta
        id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: ${{ inputs.registry-name }}
          # TODO unclear if we get passthrough from the parent
          # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_call
          # suggests so, since the event payload is "Same as the caller workflow"
          # this is easier to use than manual tag generation via booxmedialtd/ws-action-parse-semver but doesn't support major/minor
          # doesn't look like goreleaser handles major/minor either from https://goreleaser.com/customization/dockers_v2/ but packages
          # in https://github.com/OpenCHAMI/cloud-init/pkgs/container/cloud-init suggest otherwise
          # TODO goreleaser is setting a bunch of labels that maybe need to be set with
          # https://docs.docker.com/build/ci/github-actions/manage-tags-labels/
          # unclear how much built-in labeling is there already
          tags: |
            # branch event
            type=ref,event=branch
            # tag event
            type=ref,event=tag
            # pull request event
            type=ref,event=pr

      - name: Auth to registry
        uses: docker/login-action@v3.5.0
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v6.18.0
        with:
          push: true
          file: Dockerfile.build
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Unclear how https://docs.docker.com/build/ci/github-actions/attestations/ interacts with
          # multi-stage builds and cache. A separate build and cache step is useful if we copy the
          # same binary to multiple images, but a single invocation may still be able to handle that?
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          provenance: mode=max
          sbom: true
          target: ${{ inputs.docker-target }}
          platforms: linux/amd64, linux/arm64
          build-args: |
            TAG=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            REPO_INFO=https://github.com/${{ github.repository }}.git
            GOPATH=${{ env.GOPATH}}
            GOCACHE=${{ env.GOCACHE}}
            CGO_ENABLED=${{ env.CGO_ENABLED }}

  publish-release:
    runs-on: ubuntu-latest
    needs: build-push-images
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Parse semver string
      id: semver_parser
      uses: booxmedialtd/ws-action-parse-semver@v1.4.7
      with:
        input_string: ${{ github.event.ref }}
        version_extractor_regex: 'refs/tags/v(.*)$'
    - uses: ncipollo/release-action@v1.18.0
      with:
        # by default this will use the tag push tag as the tag and name
        # if we want to trigger tagging from the workflow, "tag" and "commit"
        # need to be set to create a new one
        prerelease: ${{ steps.semver_parser.outputs.prerelease != '' }}
